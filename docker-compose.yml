services:
  jupyter-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: concept-stat-gpu
    ports:
      - "8889:8888"
    volumes:
      - .:/workspace
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TF_CPP_MIN_LOG_LEVEL=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

